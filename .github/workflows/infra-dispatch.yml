name: Infra Dispatch

on:
  workflow_call:
    inputs:
      event-type:
        required: true
        type: string
        description: "Repository dispatch event type (e.g. 'flux-preview', 'balance-staging')"
      payload:
        required: true
        type: string
        description: "JSON string for client_payload"
    secrets:
      infra-dispatch-token:
        required: true
        description: "PAT with repo scope on gunk-dev/infra"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to gunk-dev/infra
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EVENT_TYPE: ${{ inputs.event-type }}
          PAYLOAD: ${{ inputs.payload }}
        with:
          github-token: ${{ secrets.infra-dispatch-token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'gunk-dev',
              repo: 'infra',
              event_type: process.env.EVENT_TYPE,
              client_payload: JSON.parse(process.env.PAYLOAD),
            });
